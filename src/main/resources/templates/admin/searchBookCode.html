<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="icon" href="https://lavelasaigon.com/wp-content/uploads/2023/01/main-logo.png" type="image/png">
<head>
    <title>NHẬP BookCode</title>
    <link rel="icon" href="https://lavelasaigon.com/wp-content/uploads/2023/01/main-logo.png" type="image/png">
   <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
   
    <style>


        h1 {
            color: #333;
            text-align: center;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #4f4c4c;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            background-color: #c09b5a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
             background-color: white;
            color: #c09b5a;
           
            border:1px solid #c09b5a;
        }

        h2, h3 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .success {
            color: green;
            font-weight: bold;
        }
        .container {
            padding: 30px;
        }
          .horizontal-info-table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    font-size: 16px;
    text-align: left;
}

.horizontal-info-table th, .horizontal-info-table td{
    border: 1px solid #dddddd;
    padding: 8px 12px;
    text-align: center;
}

.horizontal-info-table th {
    background-color: #d9b44a;
    font-weight: bold;
}
.table thead th{
background-color: #d9b44a;
 padding: 8px 12px;
    text-align: center;
}
.table td{
  border: 1px solid #dddddd;
    padding: 8px 12px;
    text-align: center;
}


.table thead th {
    white-space: nowrap; /* Prevent header text from wrapping */
}

.table td, .table th {
    text-align: center; /* Align text for better readability */
}

@media (max-width: 768px) {
    .horizontal-info-table th, .horizontal-info-table td {
        font-size: 12px; /* Smaller text for small screens */
        padding: 5px; /* Adjust padding */
    }
}
@media (max-width: 768px) {
    table.table {
        border: 0;
    }

    table.table thead {
        display: none; /* Hide the header */
    }

    table.table tr {
        display: block;
        margin-bottom: 10px;
    }

    table.table td {
        display: block;
        text-align: right; /* Align the content */
        font-size: 12px;
        padding: 5px;
        border-bottom: 1px solid #ddd;
    }

    table.table td::before {
        content: attr(data-label); /* Add labels using `data-label` */
        float: left;
        font-weight: bold;
        text-transform: uppercase;
    }
}

    </style>
</head>
<body>

<div th:replace="~{access/nav :: html}"></div>




<!-- <form th:if="${book}" th:action="@{/mailer/send}" method="post"> -->
<!--     <div th:if="${book}"> -->
<div class="container">
<div>
   	<a th:href="@{/search/bookcode}">Trở lại trang tra cứu</a>
    <h3 th:text="#{code.informationBook}"></h3>
   <table class="horizontal-info-table">
    <tr>
        <th>Mã khách hàng</th>
        <th>Ngày tạo</th>
        <th>Người dùng</th>
        <th>Email</th>
    </tr>
    <tr>
        <td><span th:text="${book.user.userCode}"></span></td>
        <td><span th:text="${#dates.format(book.createDate, 'yyyy-MM-dd HH:mm:ss')}"></span></td>
        <td><span th:text="${book.user.name}"></span></td>
        <td><span name="txtTo" th:text="${book.user.email}"></span></td>
    </tr>
</table>
    <!--  <input type="hidden" name="txtSubject" value="Thông tin phòng đã đặt"/>
     <input  name="txtTo" th:value="${book.user.email}"/>
        <input name="txtCC" th:value="${book.user.email}"/> -->
    <h3>Chi tiết Book:</h3>
	<div class="table-responsive">
	<form action="/search/admin/updateAllStatuses" method="post">
	 
    <table class="table">
        <thead>
        <tr>
			
            <th>Số Phòng</th>
            <th>Kiểu Phòng</th>
            <th>Tổng</th>
            <th>Giá</th>
            <th>Checkin</th>
            <th>Checkout</th>
            <th>Người lớn</th>
            <th>Trẻ em</th>
            <th>Phương thức thanh toán</th>
            <th>Trạng thái thanh toán</th>
            <th>Trạng thái phòng</th>
            <th>Người cập nhật</th>
  			<th>Thời gian cập nhật</th>
        </tr>
        </thead>
        <tbody th:with="content='Chi tiết đặt phòng:\n'">
          <tr th:each="detail : ${bookDetails}">
         <input  name="bookCode" th:value="${detail.book.bookCode}" />
                    <td data-label="Số Phòng" th:text="${detail.room.sophong}"></td>
                    <td data-label="Kiểu Phòng"  th:text="${detail.room.roomtype.name}"></td>
                    <td data-label="Tổng" th:text="${detail.total}"></td>
                    <td data-label="Giá" th:text="${detail.price}"></td>
                    <td data-label="Checkin" th:text="${#dates.format(detail.checkin, 'dd-MM-yyyy')}"></td>
                    <td data-label="Checkout" th:text="${#dates.format(detail.checkout, 'dd-MM-yyyy')}"></td>
                    <td data-label="Người lớn" th:text="${detail.adult}"></td>
                    <td data-label="Trẻ em" th:text="${detail.children}"></td>
                    <td data-label="Phương thức thanh toán">
        <span th:if="${detail.paymentMethod == 'cash'}">Tiền mặt</span>
        <span th:if="${detail.paymentMethod == 'transfer'}">Chuyển khoản</span>
    </td>
                   <td data-label="Trạng thái thanh toán"> 
    					<select th:name="'paymentStatus[' + ${detail.id} + ']'" >
      					  <option value="notpayment" th:selected="${detail.paymentStatus == 'notpayment'}" class="notpayment">Chưa thanh toán</option>
       					 <option value="paid" th:selected="${detail.paymentStatus == 'paid'}" class="paid">Đã thanh toán</option>
       					  <option value="return" th:selected="${detail.paymentStatus == 'return'}" class="return">Hoàn trả</option>
   						 </select>
				   </td>
					<td data-label="Trạng thái phòng">
			   			 <select th:name="'roomStatus[' + ${detail.id} + ']'">
			        <option value="notcheckin" th:selected="${detail.bookDetailStatus == 'notcheckin'}" class="notcheckin">Not Checkin</option>
			        <option value="check-in" th:selected="${detail.bookDetailStatus == 'check-in'}" class="check-in">Check-in</option>
			        <option value="checkout" th:selected="${detail.bookDetailStatus == 'checkout'}" class="checkout">Checkout</option>
			        <option value="cancel" th:selected="${detail.bookDetailStatus == 'cancel'}" class="cancel">Cancel</option>
			    </select>
				</td>
				<td data-label="Người cập nhật" th:text="${detail.updatedBy}"></td>
				<td data-label="Thời gian cập nhật" th:text="${detail.updatedAt}"></td>
                </tr>
        </tbody>
    </table>
    <div class="text-end mt-3">
            <button type="submit" class="btn btn-primary">Cập nhật</button>
        </div>
    </form>
    </div>
</div>


</div>

<div th:replace="~{access/error :: footer}"></div>

</body>
</html>
